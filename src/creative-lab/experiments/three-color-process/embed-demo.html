<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A portable additive projector</title><style>body{background:#e9e1ce;color:#343c32;font:18px/1.5 Georgia;margin:30px auto;max-width:1000px;padding:0 16px}button,input{font:inherit}button{padding:8px 14px}#projection{position:relative;height:600px;background:#171d18;overflow:hidden}label{display:block;margin:16px 0}input{width:220px}canvas{position:absolute;inset:0}a{color:inherit}</style></head><body><h1>Three records, combined as light.</h1><p>A minimal independent renderer. Drag the slider to move the red exposure; green and blue stay registered.</p><div id="projection"></div><label>Red record X <input id="offset" type="range" min="-25" max="25" step=".1" value="-8"></label><button id="align">Register all three</button><button id="export">Export PNG</button><p id="status" role="status">Loading…</p><p>Historical exposures: <a href="https://www.loc.gov/pictures/item/2018680335/">Prokudin-Gorskii / Library of Congress</a>. Digital additive projection; not physical colored-sheet stacking.</p><script type="module" src="./embed-demo.js"></script></body></html>
