<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A score for another website</title><style>body{max-width:950px;margin:30px auto;padding:0 20px;background:#e9e4d7;color:#3c4039;font:18px/1.6 Georgia,serif}h1{font-weight:400;font-style:italic}button{font:inherit;min-height:44px;padding:8px 15px;background:transparent;border:1px solid #889582;margin:0 8px 12px 0}#score{border:1px solid #bbb8a2}#score>svg{display:block;width:100%;height:auto}input{width:100%;min-height:44px;accent-color:#4a6b72}#status{font-size:15px}</style></head><body><h1>A melody in the margin.</h1><p>This independent player uses the same event data for handwriting and sound.</p><button id="play">Play melody</button><button id="pause">Pause</button><button id="reset">Blank paper</button><input id="position" type="range" min="0" max="1" step="0.001" value="0" aria-label="Writing position"><p id="status" role="status">Sound is off until Play.</p><div id="score"></div><script type="module" src="./embed-demo.js"></script></body></html>
