<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A magnetic drawing on your own paper</title><style>body{margin:24px auto;max-width:900px;padding:0 12px;background:#eee8d7;color:#35483e;font:17px Georgia}canvas{width:100%;aspect-ratio:900/760;touch-action:none;border:10px solid #53725d;border-radius:16px}button{padding:12px;margin:8px 8px 8px 0}button:focus-visible,canvas:focus-visible{outline:3px solid #276e9b}</style><h1>A magnetic layer on anything.</h1><p>Drag filings from the bottom across this original blank poster. Arrows move, Space holds or lifts, P picks up a pinch.</p><button id="pinch">Pick up a pinch</button><button id="lift">Lift</button><button id="reset">Shake clean</button><canvas tabindex="0" aria-label="Magnetic poster"></canvas><p id="status" aria-live="polite"></p><script type="module" src="./embed-demo.js"></script></html>
