<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two mirrors, your own geometry</title><style>body{margin:24px;background:#f0ebdf;color:#50483a;font:18px/1.5 Georgia,serif}main{max-width:1000px;margin:auto}canvas{display:block;width:100%;height:600px;border:1px solid #b2a589}label{display:block;margin-top:16px}input{width:100%;accent-color:#756143}button{font:inherit;padding:10px;margin-top:12px}#status{font:13px monospace}</style><script type="importmap">{"imports":{"three":"../../../vendor/three/three.module.js"}}</script><main><h1>Two mirrors. Your own scene.</h1><p>This independent integration reflects a colored box and a simple grid. Move the camera to inspect parallax.</p><canvas aria-label="Independent two-mirror demonstration"></canvas><label>Camera position<input id="camera" type="range" min="-1.6" max="1.6" step=".01" value="0"></label><label>Reflection depth<input id="depth" type="range" min="0" max="4" step="1" value="3"></label><button id="dispose">Dispose the scene</button><p id="status" role="status"></p></main><script type="module" src="./embed-demo.js"></script></html>
